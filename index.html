<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stickman Teacher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Stickman Teacher</h1>
      <div class="chips">
        <span class="chip selected-chip">Selected <strong id="selected-value">–</strong></span>
        <span class="chip status" id="status">Ready</span>
      </div>
    </header>

    <div class="stage-wrap">
      <canvas id="stage" aria-label="A stickman standing in front of a blackboard with numbers"></canvas>
    </div>

    <section class="controls">
      <div class="group">
        <h2>Selected number</h2>
        <div class="buttons">
          <button data-action="point" title="P">Point</button>
          <button data-action="circle" title="C">Circle</button>
          <button data-action="underline" title="U">Underline</button>
          <button data-action="tick" title="T">Tick</button>
          <button data-action="cross" title="X">Cross out</button>
        </div>
      </div>

      <div class="group">
        <h2>All numbers</h2>
        <div class="buttons">
          <button data-action="readAll" title="R">Read all</button>
          <button data-action="addUp" title="A">Add up</button>
          <button data-action="biggest">Biggest</button>
          <button data-action="smallest">Smallest</button>
          <button data-action="evens">Evens</button>
        </div>
      </div>

      <div class="group">
        <h2>Board</h2>
        <div class="buttons">
          <button data-action="clean" title="E">Clean</button>
          <button data-action="newNumbers" title="N">New numbers</button>
          <button data-action="wave" title="W">Wave</button>
        </div>
      </div>

      <div class="group settings">
        <h2>Chalk</h2>
        <div class="swatches">
          <button class="swatch" data-color="rgba(247, 246, 236, 0.93)" style="--c:#f7f6ec" aria-label="White" aria-pressed="true"></button>
          <button class="swatch" data-color="#ffe680" style="--c:#ffe680" aria-label="Yellow" aria-pressed="false"></button>
          <button class="swatch" data-color="#ff9ec7" style="--c:#ff9ec7" aria-label="Pink" aria-pressed="false"></button>
          <button class="swatch" data-color="#8fd3ff" style="--c:#8fd3ff" aria-label="Blue" aria-pressed="false"></button>
        </div>
        <label class="speed">
          <span>Speed <output id="speed-label">1×</output></span>
          <input id="speed" type="range" min="0.5" max="2.5" step="0.5" value="1">
        </label>
      </div>
    </section>
  </main>

  <script src="js/engine.js"></script>
  <script src="js/board.js"></script>
  <script src="js/stickman.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
