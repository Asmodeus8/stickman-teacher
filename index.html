<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A stickman teacher at a blackboard who points at, circles and works with numbers.">
  <meta name="theme-color" content="#2f5e4b">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Michael's Class</title>
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Michael's Class</h1>
      <div class="chips">
        <span class="chip selected-chip" id="selected-chip">Selected <strong id="selected-value">–</strong></span>
        <span class="chip status" id="status" role="status" aria-live="polite">
          <span id="status-text">Ready</span>
          <span class="queued" id="queued" hidden></span>
        </span>
        <button class="icon-btn" id="undo" type="button" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button class="icon-btn danger" id="stop" type="button" title="Stop (Esc)" aria-label="Stop" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
        <button class="icon-btn" id="sound" type="button" title="Sound and voice" aria-label="Sound and voice" aria-pressed="true">
          <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
          <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
        </button>
      </div>
    </header>

    <div class="stage-wrap">
      <canvas id="stage" aria-label="Michael, a stickman teacher, in front of a blackboard with numbers. Click numbers to select them."></canvas>
      <div class="quiz-banner" id="quiz-banner" role="status" aria-live="polite" hidden>
        <span class="quiz-progress" id="quiz-progress">Quiz</span>
        <strong class="quiz-prompt" id="quiz-prompt"></strong>
        <span class="quiz-score" id="quiz-score">★ 0</span>
        <button class="quiz-end" id="quiz-end" type="button">End quiz</button>
      </div>
      <div class="start-overlay" id="start-overlay">
        <button class="start-btn" id="start-class" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          <span>Start class</span>
        </button>
        <p>Sound on for Michael's voice</p>
      </div>
    </div>

    <div class="controls">
      <div class="action-groups" id="action-groups"></div>

      <section class="group settings">
        <h2>Write a number</h2>
        <form class="write" id="write-form">
          <input id="write-input" type="number" inputmode="numeric" min="0" max="999" placeholder="0 – 999" aria-label="Number to write">
          <button type="submit">Write</button>
        </form>
        <h2>Chalk</h2>
        <div class="settings-row">
          <div class="swatches" id="swatches"></div>
          <label class="speed">
            <span>Speed <output id="speed-label">1×</output></span>
            <input id="speed" type="range" min="0.5" max="2.5" step="0.5" value="1">
          </label>
        </div>
      </section>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
